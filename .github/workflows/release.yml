name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test -v ./...

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 go build -o dist/gws-cache-darwin-amd64 ./cmd/gws-cache
          GOOS=darwin GOARCH=arm64 go build -o dist/gws-cache-darwin-arm64 ./cmd/gws-cache
          GOOS=linux GOARCH=amd64 go build -o dist/gws-cache-linux-amd64 ./cmd/gws-cache
          GOOS=linux GOARCH=arm64 go build -o dist/gws-cache-linux-arm64 ./cmd/gws-cache
          GOOS=windows GOARCH=amd64 go build -o dist/gws-cache-windows-amd64.exe ./cmd/gws-cache

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
